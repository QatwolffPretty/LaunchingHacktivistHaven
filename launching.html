<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hacktivist Haven — Launching Soon</title>
<link rel="icon" type="image/png" href="forum-bg.png" />
<style>
:root{
  --bg-red:#6e0000;
  --bg-grey:#121212;
  --accent1:#ff2d55;
  --accent2:#ff6b81;
  --muted:#9aa4ab;
}
html,body{
  height:100%;
  margin:0;
  font-family:Inter,-apple-system,system-ui,'Segoe UI',Roboto,Arial;
  background:linear-gradient(135deg,var(--bg-red),var(--bg-grey));
  color:#fff;
  overflow:hidden;
}
#bgCanvas{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  filter:blur(12px) saturate(120%);
  opacity:0.9;
}
.container{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}
.logo{
  width:120px;
  height:120px;
  margin-bottom:24px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 0 40px rgba(255,45,85,0.5),0 0 80px rgba(255,45,85,0.2);
  animation:float 4s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}
h1{
  font-size:32px;
  margin:0;
  font-weight:800;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.subtitle{
  color:var(--muted);
  font-size:15px;
  margin-top:6px;
  margin-bottom:30px;
}
.countdown{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:24px;
}
.time-box{
  min-width:90px;
  padding:18px 12px;
  border-radius:16px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  backdrop-filter:blur(12px);
  box-shadow:0 6px 30px rgba(255,45,85,0.15);
  transition:transform .3s ease, box-shadow .3s ease;
}
.time-box:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 40px rgba(255,45,85,0.25);
}
.time{
  font-size:36px;
  font-weight:700;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.label{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}
.notify-form{
  margin-top:20px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}
.notify-form input{
  padding:10px 14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.06);
  background:rgba(255,255,255,0.02);
  color:#fff;
  outline:none;
  width:220px;
  transition:all .25s;
}
.notify-form input:focus{
  border-color:var(--accent1);
  box-shadow:0 0 10px rgba(255,45,85,0.3);
}
.btn{
  padding:10px 18px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:600;
  transition:all .25s;
}
.btn.primary{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#fff;
  box-shadow:0 6px 25px rgba(255,45,85,0.15);
}
.btn.primary:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 35px rgba(255,45,85,0.3);
}
.reminders{
  margin-top:20px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}
.reminders button{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.05);
  color:var(--muted);
}
.reminders button:hover{
  color:#fff;
  border-color:rgba(255,255,255,0.15);
}
footer{
  position:absolute;
  bottom:18px;
  width:100%;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}
@media(max-width:600px){
  h1{font-size:24px;}
  .time{font-size:28px;}
  .time-box{min-width:70px;padding:14px;}
}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="container">
  <div class="logo"><img src="forum-bg.png" alt="Hacktivist Haven Logo"></div>
  <h1>Hacktivist Haven</h1>
  <div class="subtitle" id="subtitle">We're launching soon. Stay tuned for something epic.</div>

  <div class="countdown">
    <div class="time-box"><div class="time" id="days">00</div><div class="label">Days</div></div>
    <div class="time-box"><div class="time" id="hours">00</div><div class="label">Hours</div></div>
    <div class="time-box"><div class="time" id="minutes">00</div><div class="label">Minutes</div></div>
    <div class="time-box"><div class="time" id="seconds">00</div><div class="label">Seconds</div></div>
  </div>

  <form class="notify-form" id="notifyForm">
    <input type="email" id="emailInput" placeholder="Enter your email" required>
    <button type="submit" class="btn primary">Notify Me</button>
  </form>

  <div class="reminders">
    <button class="btn" id="appleRemind">Add to Apple Calendar</button>
    <button class="btn" id="googleRemind">Add to Google Calendar</button>
  </div>
</div>

<footer>© 2025 Hacktivist Haven — Stay sharp, stay secure.</footer>

<script>
/* Soft Neon Particle Background */
const bg=document.getElementById('bgCanvas'),g=bg.getContext('2d');
let parts=[];
function resize(){bg.width=innerWidth;bg.height=innerHeight;}
resize();
addEventListener('resize',resize);
function makeParticles(){
  parts=[];
  const count=Math.max(30,Math.floor((bg.width*bg.height)/90000));
  for(let i=0;i<count;i++){
    parts.push({
      x:Math.random()*bg.width,
      y:Math.random()*bg.height,
      r:Math.random()*2+0.8,
      sx:(Math.random()-0.5)*0.3,
      sy:(Math.random()*0.6)+0.1,
      hue:350+Math.random()*30
    });
  }
}
makeParticles();
function drawBg(){
  g.clearRect(0,0,bg.width,bg.height);
  parts.forEach(p=>{
    const grd=g.createRadialGradient(p.x,p.y,p.r*0.2,p.x,p.y,p.r*12);
    grd.addColorStop(0,`hsla(${p.hue},100%,65%,0.12)`);
    grd.addColorStop(1,`hsla(${p.hue},100%,55%,0)`);
    g.fillStyle=grd;
    g.fillRect(p.x-p.r*12,p.y-p.r*12,p.r*24,p.r*24);
    p.x+=p.sx;p.y+=p.sy;
    if(p.x>bg.width+50)p.x=-50;if(p.y>bg.height+50)p.y=-50;if(p.x<-50)p.x=bg.width+50;
  });
  requestAnimationFrame(drawBg);
}
drawBg();

/* Countdown Logic */
const launchDate = new Date("2025-10-24T00:00:00").getTime(); // Adjust launch date
const dEl=document.getElementById('days'),
      hEl=document.getElementById('hours'),
      mEl=document.getElementById('minutes'),
      sEl=document.getElementById('seconds'),
      sub=document.getElementById('subtitle');

function updateCountdown(){
  const now = new Date().getTime();
  const gap = launchDate - now;

  if(gap <= 0){
    sub.textContent = "🚀 We're Live! Redirecting...";
    dEl.textContent=hEl.textContent=mEl.textContent=sEl.textContent='00';
    setTimeout(()=>{ window.location.href='index.html'; }, 4000);
    return;
  }

  const d = Math.floor(gap / (1000 * 60 * 60 * 24));
  const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
  const s = Math.floor((gap % (1000 * 60)) / 1000);

  dEl.textContent = d.toString().padStart(2,'0');
  hEl.textContent = h.toString().padStart(2,'0');
  mEl.textContent = m.toString().padStart(2,'0');
  sEl.textContent = s.toString().padStart(2,'0');
}
setInterval(updateCountdown, 1000);
updateCountdown();

/* Notify Me Submission */
document.getElementById('notifyForm').addEventListener('submit',e=>{
  e.preventDefault();
  const email=document.getElementById('emailInput').value.trim();
  if(!email){alert('Please enter a valid email');return;}
  alert(`✅ Thanks ${email}! You'll be notified when we launch.`);
  document.getElementById('emailInput').value='';
});

/* Calendar Reminders */
document.getElementById('appleRemind').addEventListener('click',()=>{
  const ics=`BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
SUMMARY:Hacktivist Haven Launch
DESCRIPTION:Hacktivist Haven website is now live! Visit us at hactivisthaven.com
DTSTART:20251231T000000Z
DTEND:20251231T010000Z
END:VEVENT
END:VCALENDAR`;
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download='hacktivist-haven-launch.ics';
  link.click();
});

document.getElementById('googleRemind').addEventListener('click',()=>{
  const url='https://www.google.com/calendar/render?action=TEMPLATE&text=Hacktivist%20Haven%20Launch&dates=20251231T000000Z/20251231T010000Z&details=Hacktivist%20Haven%20is%20live!&location=https://hactivisthaven.com';
  window.open(url,'_blank');
});
</script>
</body>
</html>
